# Trivial comment-only change (2026-08-27) to verify .github/workflows/deploy-cron-workers.yml
# actually fires on a real push to this branch/directory, before Sammy provisions the
# CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID secrets - this commit is expected to trigger
# the workflow and have detect-changes succeed while deploy-curate fails cleanly on the
# missing secret, proving the "fails loudly, never silently" design goal.
name = "heatchecks-curate-cron"
main = "src/index.ts"
compatibility_date = "2026-08-12"

# Three different cadences on one worker (2026-08-26): "0 10 * * *" is the original once-daily
# slot, timed so drafts are waiting at 6:00 AM Eastern for morning review (Cloudflare Cron
# Triggers run fixed UTC with no DST awareness: 10:00 UTC is 6 AM during EDT; once the US
# falls back to EST in November this drifts to 5:00 AM Eastern unless nudged to "0 11 * * *"
# for the winter months). Distinct from worker-settle's 0 9 * * * so the two don't compete for
# the same window. scheduled() below branches on event.cron: ONLY this slot runs the full
# chain (it's the one that spends real Anthropic API credits via /api/curate) - "0 18 * * *"
# and "0 2 * * *" run just the three free/idempotent sweeps (ticker/notify/discord), spaced
# ~8h apart so a Tank published any time of day gets tagged/posted/notified within a few
# hours instead of waiting for the next morning's full run. Sammy asked for 3x/day on the
# sweeps specifically (2026-08-26) - add more slots here if that cadence needs tightening,
# but never add one that isn't handled in the event.cron branch below, or it'll silently
# run the full (paid) chain instead of just the sweeps.
#
# "0 12 * * 2" (Tuesday, 2026-08-26) is a fourth, distinct slot: the weekly NFL season-
# league auto-slate (/api/league-slate-sweep via runLeagueSlateSweep in src/index.ts),
# timed after Monday Night Football concludes and the week's lines settle. Not a sweep,
# not the full chain - its own third branch in event.cron below.
[triggers]
crons = ["0 10 * * *", "0 18 * * *", "0 2 * * *", "0 12 * * 2"]

[vars]
# Staging posture (2026-08-21): curation runs against the auth-sessions branch alias,
# NOT production - only settlement is live on heatchecks.io for now. Flip this back to
# https://heatchecks.io/api/curate when the content pipeline is promoted.
CURATE_URL = "https://auth-sessions.heatcheck.pages.dev/api/curate"

# CURATE_SECRET is a real secret, not a plaintext var - set it with:
#   npx wrangler secret put CURATE_SECRET --config worker-curate/wrangler.toml
# using the same value configured as CURATE_SECRET for the Pages project.
