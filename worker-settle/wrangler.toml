name = "heatchecks-settle-cron"
main = "src/index.ts"
compatibility_date = "2026-08-12"

# ONE hourly trigger, not two, and deliberately so: the account is capped at 5 cron
# triggers (Workers Free) and worker-curate holds the other four, so a sixth is rejected
# at deploy (tried 2026-08-29). scheduled() in src/index.ts branches on the hour instead:
# every hour runs the standing health check (pre-launch Audit 4 - ledger invariant,
# scheduled-job freshness, security bursts, daily summary), and the 09:00 UTC pass ALSO
# runs settlement, exactly the cadence the single "0 9 * * *" trigger used to give.
#
# 9am UTC for settlement is a placeholder chosen to land after West Coast games finish -
# retune SETTLE_HOUR_UTC in src/index.ts once real game-finality timing matters.
#
# The cost of sharing one trigger: if it ever stops firing, settlement and the health
# check stop together, and no in-Cloudflare check would notice. That is precisely what
# the Healthchecks.io pings cover - they are watched from outside this account, and a
# missing ping emails regardless of what happened here.
[triggers]
crons = ["0 * * * *"]

[vars]
SETTLE_URL = "https://heatchecks.io/api/settle"

# Preview also gets settled on the same schedule (2026-08-22): production's /api/settle
# doesn't carry the ticker-settlement code yet (that's still auth-sessions-only), so this
# is the only place the tag/settle side of the Exchange tickers can be observed running
# on a real automatic cadence rather than by hand. Preview is called BEFORE production
# (2026-08-27, see runSettle() in src/index.ts): both point at the same DB, and preview's
# settle is the hardened superset (outcome-order-mismatch guard, Kalshi, tickers), so it
# must win the race for pending picks. Drop this once the content pipeline (and ticker
# settlement) is promoted to production and the split above goes away.
PREVIEW_SETTLE_URL = "https://auth-sessions.heatcheck.pages.dev/api/settle"

# SETTLE_SECRET is a real secret, not a plaintext var - set it with:
#   npx wrangler secret put SETTLE_SECRET --config worker-settle/wrangler.toml
# using the same value configured as SETTLE_SECRET for the Pages project. The same
# secret authenticates both SETTLE_URL and PREVIEW_SETTLE_URL (confirmed 2026-08-22).

# Workers Logs retention - same reasoning as worker-curate/wrangler.toml's block: this
# Worker's sibling sweeps report their outcome in a response body only it ever sees, so
# without retention a failed sweep is indistinguishable from a quiet night. That applies
# doubly to /api/tank-resolution-sweep, which spends Anthropic credits and reports what
# it wrote (or skipped, or abandoned) purely through the body logged here.
[observability]
enabled = true
head_sampling_rate = 1
